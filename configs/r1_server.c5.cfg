# -----------------------------------------------------------------------------
# 2026/10/20 새로운 기능 추가 (확장 포트 검사)
#
# 'E' Commnd 설정 (Extention Port, Header14 or Header7)
# 확장포트 검사에 사용되는 ADC 포트의 Group(Header40을 제외한 나머지는 각각 ADC에 연결되므로)
#
# E,{확장포트 그룹 번호, 0..x}, {Total Port갯수}, {ADC Port List}...,
#
# 핀 개수와 일치하도록 설정 (사용하지 않는 포트는 -1), 1번 핀부터 설정,
# 핀 개수에서 0번 핀은 제외함
# -----------------------------------------------------------------------------
# R1 14 PIN Header참조
# -----------------------------------------------------------------------------
E,0,14,-1,-1,-1,P1_5.7,-1,P1_5.6,-1,P1_5.5,P1_1.3,-1,P1_1.2,P1_5.4,P1_1.1,-1,

